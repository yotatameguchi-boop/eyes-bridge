# 手元で動かすための最小構成。
#
# Supabase 本体（Auth / Realtime / Edge Functions）はここには入れない。
# それは `supabase start` の仕事で、二重に持つと設定がずれる。
# ここで立てるのは「Supabase CLI が無くても触れる部分」だけ:
#
#   db      … マイグレーションを当てた Postgres。テストと SQL いじりに使う
#   livekit … 開発モードの SFU。通話の疎通確認に使う
#   ocr     … PaddleOCR。読み上げ経路の確認に使う
#
#   docker compose up -d db livekit   # 軽い。すぐ上がる
#   docker compose up -d ocr          # 初回はモデルを落とすので数分かかる

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyes_bridge
      # ロケールを固定しないと、エラーメッセージが環境で変わって
      # テストの文字列判定が落ちる
      LANG: C
      LC_MESSAGES: C
    ports:
      - "55432:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/tests:/stub:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyes_bridge"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:latest
    # --dev は固定の鍵（devkey / secret）で起動する。
    # 本番の鍵をここに書かないための開発専用モード。
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"      # WebSocket / API
      - "7881:7881"      # TCP フォールバック
      - "7882:7882/udp"  # ICE/UDP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 10

  ocr:
    build: ./ocr
    ports:
      # 8080 は他のプロジェクトと衝突しやすいので既定をずらす。
      # OCR_PORT=xxxx で変えられる。
      - "${OCR_PORT:-8081}:8080"
    environment:
      ALLOWED_ORIGINS: "*"
      # 本人確認書類が飛んでくる口なので、未設定だと 503 で閉じる。
      # 手元用の固定値。本番では必ず変える。
      INSPECT_TOKEN: "${INSPECT_TOKEN:-local-dev-inspect-token}"
      # 既定は mobile 系。精度を上げたいときだけ server 系に戻す
      # （そのぶんモデルが数百MBになり、初回取得が長い）
      OCR_DET_MODEL: "${OCR_DET_MODEL:-PP-OCRv5_mobile_det}"
      OCR_REC_MODEL: "${OCR_REC_MODEL:-PP-OCRv5_mobile_rec}"
    volumes:
      # モデルはイメージに焼かず、ここに残す。
      # 初回の1リクエストだけ待たされるが、以降の再起動では落とし直さない。
      - paddle-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  db-data:
  paddle-models:

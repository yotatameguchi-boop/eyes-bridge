# 手元で動かすための最小構成。
#
# Supabase 本体（Auth / Realtime / Edge Functions）はここには入れない。
# それは `supabase start` の仕事で、二重に持つと設定がずれる。
# ここで立てるのは「Supabase CLI が無くても触れる部分」だけ:
#
#   db      … マイグレーションを当てた Postgres。テストと SQL いじりに使う
#   livekit … 開発モードの SFU。通話の疎通確認に使う
#   ocr     … PaddleOCR。読み上げ経路の確認に使う
#
#   docker compose up -d db livekit   # 軽い。すぐ上がる
#   docker compose up -d ocr          # 初回はモデルを落とすので数分かかる

services:
  db:
    # Docker（Docker Desktop）が再起動しても、手で上げ直さなくていいように
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eyes_bridge
      # ロケールを固定しないと、エラーメッセージが環境で変わって
      # テストの文字列判定が落ちる
      LANG: C
      LC_MESSAGES: C
    ports:
      - "55432:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
      - ./supabase/migrations:/migrations:ro
      - ./supabase/tests:/stub:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eyes_bridge"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    # Docker（Docker Desktop）が再起動しても、手で上げ直さなくていいように
    restart: unless-stopped
    image: livekit/livekit-server:latest
    # --dev は固定の鍵（devkey / secret）で起動する。
    # 本番の鍵をここに書かないための開発専用モード。
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"      # WebSocket / API
      - "7881:7881"      # TCP フォールバック
      - "7882:7882/udp"  # ICE/UDP
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 5s
      timeout: 3s
      retries: 10

  ocr:
    # Docker（Docker Desktop）が再起動しても、手で上げ直さなくていいように
    restart: unless-stopped
    build: ./ocr
    ports:
      # 8080 は他のプロジェクトと衝突しやすいので既定をずらす。
      # OCR_PORT=xxxx で変えられる。
      - "${OCR_PORT:-8081}:8080"
    environment:
      # 呼べるのは Edge Function だけ。未設定だと全部の口が 503 で閉じる。
      # 手元用の固定値。本番では必ず変える。
      OCR_TOKEN: "${OCR_TOKEN:-local-dev-ocr-token}"
      # 既定は mobile 系。精度を上げたいときだけ server 系に戻す
      # （そのぶんモデルが数百MBになり、初回取得が長い）
      OCR_DET_MODEL: "${OCR_DET_MODEL:-PP-OCRv5_mobile_det}"
      OCR_REC_MODEL: "${OCR_REC_MODEL:-PP-OCRv5_mobile_rec}"
    volumes:
      # モデルはイメージに焼かず、ここに残す。
      # 初回の1リクエストだけ待たされるが、以降の再起動では落とし直さない。
      - paddle-models:/root/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # 運営画面。接続先の Supabase は build 時に埋め込まれる。
  # 既定では立ち上げない（キーが要るので）。使うときだけ:
  #   ADMIN_SUPABASE_ANON_KEY=... docker compose --profile admin up -d --build admin
  admin:
    # Docker（Docker Desktop）が再起動しても、手で上げ直さなくていいように
    restart: unless-stopped
    profiles: ["admin"]
    build:
      context: ./admin
      args:
        VITE_SUPABASE_URL: "${ADMIN_SUPABASE_URL:-http://127.0.0.1:54321}"
        # ここを :? にすると、admin 以外のサービスを上げるときまで
        # 未設定で落ちる。空で渡して Dockerfile 側で止める。
        VITE_SUPABASE_ANON_KEY: "${ADMIN_SUPABASE_ANON_KEY:-}"
    ports:
      - "${ADMIN_PORT:-5180}:80"

volumes:
  db-data:
  paddle-models:

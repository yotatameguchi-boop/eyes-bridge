<!-- ログインコードのメール。
     アプリも運営画面も「6桁のコードを入力する」作りなので、
     Supabase 既定の「リンクだけ」のメールではログインできない。
     {{ .Token }} を必ず入れること。 -->
<h2>eyes-bridge のログインコード</h2>

<p>アプリの入力欄に、次の6桁を入れてください。</p>

<p style="font-size:32px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>

<!-- スクリーンリーダーは「123456」を「十二万三千…」と数として読む。
     1桁ずつ聞き取れるよう、区切った形も並べる（上の続き数字はコピーと自動入力用）。
     Go のテンプレートの range は文字列を回せないので、slice で1桁ずつ切り出す。
     桁数は config.toml の otp_length = 6 と揃えてある。 -->
<p>読み上げ用（1桁ずつ）：
{{ slice .Token 0 1 }}、{{ slice .Token 1 2 }}、{{ slice .Token 2 3 }}、{{ slice .Token 3 4 }}、{{ slice .Token 4 5 }}、{{ slice .Token 5 6 }}</p>

<p>このコードは短時間で使えなくなります。心当たりが無い場合は、このメールを無視してください。</p>

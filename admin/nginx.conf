server {
  listen 80;
  root /usr/share/nginx/html;

  # 本人確認書類を表示する画面なので、外に漏らさない
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;

  # 読み込んでよいものを、この画面と Supabase だけに絞る。
  # 運営のログイン情報は画面の中（localStorage）にあるので、万一どこかから
  # スクリプトを差し込まれても、外へ送れない・外のスクリプトを読めないようにする。
  #   * スクリプトはこの画面のものだけ（インラインも不可）
  #   * 通信はこの画面と Supabase（REST / Storage / Realtime）だけ
  #   * 画像は Supabase の署名付き URL（本人確認書類）だけ
  # __SUPABASE_ORIGIN__ / __SUPABASE_WS_ORIGIN__ はイメージを作るときに置き換える（Dockerfile）
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: __SUPABASE_ORIGIN__; connect-src 'self' __SUPABASE_ORIGIN__ __SUPABASE_WS_ORIGIN__; font-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri /index.html;
  }
}
